# Проверки реестра RustGIS (scripts/build.py хранилища
# opengeos/rustgis-plugins) над plugin.json расширения-процесса.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверки реестра RustGIS
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengeos/rustgis-plugins/main/scripts/build.py -o registry-build.py
          python - <<'EOF'
          import importlib.util, json
          spec = importlib.util.spec_from_file_location("b", "registry-build.py")
          b = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(b)
          manifest = json.load(open("plugin.json", encoding="utf-8"))
          b.check_manifest(manifest, "rustplanetx")
          for p in b.problems:
              print("error:", p)
          raise SystemExit(1 if b.problems else 0)
          EOF
