# RustPlanetX - расширение RustGIS, глобус PlanetX со связью с картой RustGIS.
# Copyright (C) 2026 ООО «Информ++». Лицензия Apache 2.0.
# SPDX-License-Identifier: Apache-2.0
#
# Выпуск по метке v*: программа RustPlanetX собирается из исходников
# PlanetX Lite на коммите из lite.ref, пакет проверяется scripts/build.py
# реестра RustGIS и уходит в выпуск GitHub вместе с записью реестра.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Коммит PlanetX Lite
        id: lite
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < lite.ref)" >> "$GITHUB_OUTPUT"

      # Номер выпуска - из plugin.json. Тег должен с ним совпадать:
      # 8 ноября 2026 года тег v0.4.5 ушёл на манифест 0.5.0.
      - name: Версия расширения
        id: version
        shell: bash
        run: |
          v=$(python -c "import json; print(json.load(open('plugin.json', encoding='utf-8'))['version'])")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с версией plugin.json $v"
            exit 1
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: Valery35/planetx-lite
          ref: ${{ steps.lite.outputs.ref }}
          path: lite

      - name: Rust ${{ env.RUST_VERSION }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      # Номер выпуска - в окно «О программе» глобуса.
      - name: Сборка RustPlanetX
        shell: bash
        working-directory: lite
        env:
          RUSTPLANETX_VERSION: ${{ steps.version.outputs.v }}
        run: cargo build --release --locked -p planetx-rustgis

      - name: Пакет
        shell: pwsh
        run: ./scripts/package.ps1 -Lite lite/target/release/rustplanetx.exe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверки реестра RustGIS
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengeos/rustgis-plugins/main/scripts/build.py -o registry-build.py
          python - <<'EOF'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location("b", "registry-build.py")
          b = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(b)
          data = next(pathlib.Path("dist").glob("*.rgplugin")).read_bytes()
          read = b.read_package(data, "rustplanetx")
          if read:
              b.check_manifest(read[0], "rustplanetx")
              b.check_process(data, read[0], "rustplanetx")
          for p in b.problems:
              print("error:", p)
          raise SystemExit(1 if b.problems else 0)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            dist/*.rgplugin
            dist/*.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Выпуск GitHub с пакетом и записью реестра
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.rgplugin dist/*.json --verify-tag --title "$RELEASE_TAG" --generate-notes
