[package]
name = "rustplanetx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Расширение RustGIS: вид карты в PlanetX Lite и каталог источников PlanetX"
repository = "https://github.com/Valery35/rustplanetx"
publish = false

# Расширение - модуль WebAssembly:
#   cargo build --release --target wasm32-unknown-unknown
# rlib - для cargo test на своей машине.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

# SDK ссылается на импорты хоста: на Windows их без модуля WebAssembly
# не слинковать, поэтому SDK - только у wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rustgis-plugin = { git = "https://github.com/opengeos/rustgis-plugins" }

# Модуль маленький, паника обрывает вызов, RustGIS сообщает об отказе.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
